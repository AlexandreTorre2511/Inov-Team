<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes clients Inov Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Système Inov Team Outils internes. Structure : barre latérale de comptes, bandeau dégradé par client, cartes numérotées 01 à 06. */
:root{
  --brand-1:#0644FD;--brand-1b:#5B4BE6;--brand-2:#824FD2;--brand-2b:#9A47CC;--brand-3:#C23BAF;
  --bg:#F4F5FB;--surface:#FFFFFF;--sunk:#EEF0F8;--side:#FFFFFF;--line:#E3E6F1;--line-2:#CDD2E4;
  --fg:#11163A;--muted:#5D6488;--faint:#8A90B0;
  --accent:#2445F4;--accent-2:#1531D2;--accent-soft:#EBEFFF;--on-accent:#FFFFFF;
  --ok:#1E8C5A;--ok-soft:#E1F5EB;--warn:#B26700;--warn-soft:#FFF1DA;
  --c-com:#8048D0;--c-com-soft:#F1EAFC;--c-ev:#C23BAF;--c-ev-soft:#FBE7F7;--c-rh:#0B8E9C;--c-rh-soft:#DFF5F7;
  --shadow-card:0 1px 2px rgba(17,22,58,.05),0 8px 24px -12px rgba(17,22,58,.12);
  --shadow-pop:0 24px 60px -20px rgba(17,22,58,.35);
  --font-display:"Quicksand","Plus Jakarta Sans",system-ui,sans-serif;
  --font-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --grad:linear-gradient(105deg,var(--brand-1) 0%,var(--brand-1b) 45%,var(--brand-2b) 75%,var(--brand-3) 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D1C;--surface:#121630;--sunk:#1A1F3C;--side:#0E1228;--line:#242A4B;--line-2:#323962;
  --fg:#E9EBF8;--muted:#A0A6CA;--faint:#7279A0;--accent:#7E93FF;--accent-2:#A5B3FF;--accent-soft:#1C2455;--on-accent:#0A0D1C;
  --ok:#5ED39A;--ok-soft:#12321F;--warn:#F4B860;--warn-soft:#382711;
  --c-com:#B996F5;--c-com-soft:#2A1F48;--c-ev:#F08ADF;--c-ev-soft:#3A173A;--c-rh:#4FD0DC;--c-rh-soft:#0E3036;
  --shadow-card:0 1px 2px rgba(0,0,0,.35);--shadow-pop:0 24px 60px -20px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D1C;--surface:#121630;--sunk:#1A1F3C;--side:#0E1228;--line:#242A4B;--line-2:#323962;
  --fg:#E9EBF8;--muted:#A0A6CA;--faint:#7279A0;--accent:#7E93FF;--accent-2:#A5B3FF;--accent-soft:#1C2455;--on-accent:#0A0D1C;
  --ok:#5ED39A;--ok-soft:#12321F;--warn:#F4B860;--warn-soft:#382711;
  --c-com:#B996F5;--c-com-soft:#2A1F48;--c-ev:#F08ADF;--c-ev-soft:#3A173A;--c-rh:#4FD0DC;--c-rh-soft:#0E3036;
  --shadow-card:0 1px 2px rgba(0,0,0,.35);--shadow-pop:0 24px 60px -20px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);min-height:100%}
body{font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-family:var(--font-display);font-size:17px;font-weight:700}
h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
p{margin:0}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px 16px;gap:16px;z-index:10}
.brand{padding:0 6px;display:flex;flex-direction:column;gap:8px}
.brand b{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.blogo{display:block}.blogo img{width:176px;height:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blogo{background:#fff;border-radius:12px;padding:8px 10px;width:max-content}}
:root[data-theme="dark"] .blogo{background:#fff;border-radius:12px;padding:8px 10px;width:max-content}
@media (max-width:900px){.blogo img{width:104px}}
.navsec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 12px 2px}
nav.nav{display:flex;flex-direction:column;gap:2px}
nav.nav button{position:relative;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600}
nav.nav button:hover{background:var(--sunk);color:var(--fg)}
nav.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.nav button[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
nav.nav .lbl{flex:1}
.mono-ini{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.03em;background:var(--sunk);color:var(--muted);flex:none}
nav.nav button[aria-current="page"] .mono-ini{background:var(--grad);color:#fff}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--grad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:var(--sunk);color:var(--muted)}
.side-foot{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.side-foot b{display:block;font-size:13px;line-height:1.2}
.side-foot > div > span{font-size:11.5px;color:var(--muted)}

.work{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px}
.crumb b{color:var(--fg)}
.date{font-family:var(--font-mono);font-size:12px;color:var(--faint)}
main{padding:28px 32px 72px;display:flex;flex-direction:column;gap:22px;max-width:1320px;width:100%}

.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--grad);color:#fff;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;box-shadow:var(--shadow-pop)}
.hero > div{position:relative;z-index:1;min-width:0}
.hero h1{font-size:30px;color:#fff}
.hero p{color:rgba(255,255,255,.9);max-width:620px;margin-top:6px}
.hero .sun{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:340px;height:340px;opacity:.22;pointer-events:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.88}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hchip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.hchip svg{width:14px;height:14px}
.hcount{text-align:right}
.hcount b{display:block;font-family:var(--font-display);font-size:48px;line-height:1;font-weight:700}
.hcount span{font-size:12.5px;color:rgba(255,255,255,.88)}

.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g3,.g4{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;box-shadow:var(--shadow-card)}
.card > .ch{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card > .ch .tt{display:flex;flex-direction:column;gap:2px}
.card > .cb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.04em}
.cb p + p{margin-top:0}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card);min-width:0}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi b{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .kf{font-size:12px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-com{background:var(--c-com-soft);color:var(--c-com)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tech{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--fg)}

.dept{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.dept-i{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.dept-i.ours{background:var(--accent-soft);border-color:transparent}
.dept-i .dt{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dept-i .dd{font-size:12.5px;color:var(--muted);margin-top:2px}
.dept-k{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.dept-i.ours .dept-k{background:var(--grad);color:#fff;border-color:transparent}
.chips6{display:flex;flex-wrap:wrap;gap:8px}
.chip6{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px}
.chip6.ours{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.metier{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.metier:last-child{border-bottom:0;padding-bottom:0}
.metier:first-child{padding-top:0}
.metier .mi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c-com-soft);color:var(--c-com)}
.metier b{display:block}
.metier span{font-size:12.5px;color:var(--muted)}

.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em}
.av.sm{width:30px;height:30px;font-size:11px}
.av.h0{background:linear-gradient(135deg,#0644FD,#5B4BE6)} .av.h1{background:linear-gradient(135deg,#5B4BE6,#9A47CC)} .av.h2{background:linear-gradient(135deg,#9A47CC,#C23BAF)}
.av.h3{background:linear-gradient(135deg,#0B8E9C,#2445F4)} .av.h4{background:linear-gradient(135deg,#C23BAF,#E0607E)} .av.h5{background:linear-gradient(135deg,#2445F4,#0B8E9C)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-width:0}
.person b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person > div > span{font-size:11.5px;color:var(--muted)}
.empty{padding:14px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:13px}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft)}
.alert .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}
.alert ul{margin:4px 0 0;padding-left:18px}
.alert b{color:var(--fg)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
ol.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.q{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px}
.qcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.qcols{grid-template-columns:minmax(0,1fr)}}
.qcol{display:flex;flex-direction:column;gap:8px}

.acc{display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-card);color:var(--fg)}
.acc:hover{border-color:var(--line-2);background:var(--sunk)}
.acc .ah{display:flex;align-items:center;gap:12px}
.acc .ai{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.acc .ah b{display:block;font-family:var(--font-display);font-size:17px;font-weight:700}
.acc .ah > div > span{font-size:12.5px;color:var(--muted)}
.acc .an{margin-left:auto;text-align:right}
.acc .an b{font-family:var(--font-display);font-size:26px;line-height:1}
.acc .an span{font-size:11px;color:var(--muted);display:block}
.lplate{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;padding:10px 14px;height:64px;margin-bottom:14px;box-shadow:0 6px 18px -8px rgba(17,22,58,.35)}
.lplate img{max-height:44px;max-width:180px;width:auto;height:auto;display:block}
.lplate.sq{padding:6px;width:64px}.lplate.sq img{max-height:52px}
.alogo{height:44px;min-width:44px;max-width:132px;flex:none;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.alogo img{max-height:30px;max-width:112px;width:auto;height:auto;display:block}
.alogo.sq{padding:4px;width:44px}.alogo.sq img{max-height:34px}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--grad)}
.acc .via{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.acc .via svg{width:14px;height:14px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sechead p{color:var(--muted);margin-top:4px}
.src{font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.contacts{display:flex;flex-direction:column;gap:8px}
.contact{display:flex;gap:10px;align-items:center}
.contact b{display:block;font-size:13px}
.contact > div > span{font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .navsec,.side-foot{display:none}
  nav.nav{flex-direction:row;overflow-x:auto;width:100%}
  nav.nav button{white-space:nowrap;padding:8px 12px}
  nav.nav button[aria-current="page"]::before{display:none}
  .top{padding:12px 16px;position:static}
  main{padding:20px 16px 56px}
  .hcount{text-align:left}
}
@media (prefers-reduced-motion:no-preference){nav.nav button,.acc{transition:background .15s,border-color .15s,color .15s}}
.acc .ah{justify-content:space-between}
.aname b{display:block;font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.25}
.aname span{font-size:12.5px;color:var(--muted)}
.acc{gap:12px}
main{margin-inline:auto}
nav.nav{scrollbar-width:none}nav.nav::-webkit-scrollbar{display:none}
img{max-width:100%}
@media (max-width:900px){
  .hero{padding:22px 20px}
  .hero h1{font-size:26px}
  .hero .sun{width:220px;height:220px;right:-90px;top:28px;transform:none;opacity:.16}
  .hcount b{font-size:40px}
  .lplate{height:54px;padding:8px 12px}.lplate img{max-height:36px;max-width:150px}
  .lplate.sq{width:54px}.lplate.sq img{max-height:44px}
  .brand{flex-direction:row;align-items:center;gap:12px}
  .card > .ch,.card > .cb{padding-inline:16px}
  .dept-i{padding:12px}
}
@media (max-width:480px){
  .side{padding:10px 12px}
  .brand span:last-child{display:none}
  .people{grid-template-columns:minmax(0,1fr)}
  .hero{gap:14px}
  .top{padding:10px 16px}
  .date{display:none}
}
@media (min-width:1600px){main{max-width:1440px}}
@media (max-width:640px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kpi{padding:14px;gap:6px}.kpi b{font-size:26px}.kpi .ki{width:28px;height:28px}.kpi .kt{font-size:12px}}

/* Statistiques */
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g2{grid-template-columns:minmax(0,1fr)}}
.phead h1{font-size:26px}.phead p{color:var(--muted);margin-top:4px;max-width:70ch}
.meter{height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden;margin-top:2px}
.meter > i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.hb{display:flex;flex-direction:column;gap:10px}
.hr{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 44px;align-items:center;gap:12px;position:relative;padding:3px 0;border-radius:8px;cursor:default}
.hr .hl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .ht{height:18px;position:relative}
.hr .ht::before{content:"";position:absolute;inset:8px 0 auto 0;height:1px;background:var(--line)}
.hr .hf{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0;min-width:4px}
.hr .hv{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.hr:hover .hf,.hr:focus-visible .hf{background:var(--accent-2)}
.hr:hover{background:var(--sunk)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-pop);max-width:260px;display:none}
.tip span{display:block;font-weight:500;opacity:.8}
.cnote{font-size:12px;color:var(--muted)}
details.tv summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent)}
details.tv table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
details.tv th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 8px;border-bottom:1px solid var(--line)}
details.tv td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
@media (max-width:480px){.hr{grid-template-columns:96px minmax(0,1fr) 36px;gap:8px}}
/* Cartes comptes : chiffres jamais coupés */
.acc .an{flex:none;white-space:nowrap}
.acc .an b{font-variant-numeric:tabular-nums}
.acc .alogo{flex:0 1 auto;min-width:0}

:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c}
.donut{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--line)}
.donut svg{width:150px;height:150px;flex:none}
.donut path{cursor:default}
.donut path:hover,.donut path:focus-visible{opacity:.85}
.donut .dc{font-family:var(--font-display);font-size:26px;font-weight:700;fill:var(--fg)}
.donut .dcs{font-size:11px;fill:var(--muted)}
.lg{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 180px}
.lg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px}
.lg i{width:12px;height:12px;border-radius:3px}
.lg b{font-weight:600}
.lg span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.lg em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:24px}

.plogo{display:inline-grid;place-items:center;background:#fff;border-radius:6px;vertical-align:middle;flex:none}
.plogo img{display:block;width:auto;height:auto}
.plogo.sm{padding:2px 6px;border:1px solid var(--line)}.plogo.sm img{max-height:15px;max-width:84px}
.plogo.hero{padding:2px 7px;margin-inline:2px}.plogo.hero img{max-height:14px;max-width:70px}
.plogo.ct{width:44px;height:30px;padding:4px;border:1px solid var(--line);border-radius:8px}.plogo.ct img{max-height:20px;max-width:36px}
.acc .via{flex-wrap:wrap}

/* Questionnaire (styles repris du système Inov Team) */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 1px 2px rgba(17,22,58,.12)}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.grad{background:var(--grad);border-color:transparent;color:#fff}.btn.grad:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line-2);box-shadow:none}.btn.sec:hover{background:var(--sunk)}
.btn.danger{background:var(--surface);color:#D0263C;border-color:var(--line-2);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg.i{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lbl{font-weight:700;font-size:13px}
.req{color:#D0263C}
.hint{font-size:12px;color:var(--muted);font-weight:500}
select,input[type=text],textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.qf{gap:18px}
.qf h3{margin-top:6px}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
@media (max-width:760px){.qgrid{grid-template-columns:minmax(0,1fr)}}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.alert.info{background:var(--accent-soft)}.alert.info .dot{background:var(--accent)}
.alert.rouge{background:#FDE6E9}.alert.rouge .dot{background:#D0263C}
.alert a{font-weight:700}
.byline{font-size:12px;color:var(--muted)}

/* Suivi collaborateurs */
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.small{font-size:12px}
.kpi.warn .ki{background:#FFF1DA;color:#B26700}.kpi.warn b{color:#B26700}
.kpi b.kpi-s{font-size:26px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.tablewrap th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tablewrap td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tablewrap tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.num-c{font-variant-numeric:tabular-nums;font-weight:700}
.cal{padding:0 12px 4px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px 0 6px}
.cal-h span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cd{min-height:104px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.cd.we{background:var(--sunk)}
.cd.empty-d{border:0;background:transparent}
.cd .dn{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cd.today{border-color:transparent;box-shadow:0 0 0 2px var(--accent) inset}
.cd.today .dn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-weight:600}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor}
.ev .mono{font-size:10.5px;opacity:.85}
.st-todo{background:var(--sunk);color:var(--muted)}
.st-plan{background:var(--accent-soft);color:var(--accent)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-late{background:var(--warn-soft);color:var(--warn)}
.ev.late,.pill.late{background:#FDE6E9;color:#D0263C}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend i.st-todo{background:var(--line-2)}.legend i.st-plan{background:var(--accent)}.legend i.st-done{background:var(--ok)}.legend i.st-late{background:var(--warn)}.legend i.st-overdue{background:#D0263C}
.agenda{display:none;flex-direction:column;padding:4px 16px}
.ag-i{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.ag-i:last-child{border-bottom:0}
.ag-d{display:flex;flex-direction:column;font-weight:700;font-size:13px}.ag-d .mono{font-weight:500;color:var(--muted);font-size:12px}
.ag-n b{display:block;font-size:13.5px}.ag-n span{font-size:12px;color:var(--muted)}
@media (max-width:760px){.cal{display:none}.agenda{display:flex}}
.overlay{position:fixed;inset:0;background:rgba(10,13,28,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-pop);width:min(580px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;border:1px solid var(--line);margin:0}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mb{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:0 0 18px 18px}
.modal .mf .hint{margin-right:auto}
input[type=date]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;width:100%}
.modal .person,.tablewrap .person{border:0;background:none;padding:0}
</style>
</head>

const total = C.reduce((s,c)=>s+c.collabs.length,0);
const bigTotal = C.filter(c=>c.big).reduce((s,c)=>s+c.collabs.length,0);
const maxC = Math.max(...C.map(c=>c.collabs.length));
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hv = s => { let h=0; for (const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return "h"+(h%6); };
const initials = n => { const p=n.split(" "); return (p[0][0]+(p[p.length-1][0]||"")).toUpperCase(); };
const plural = (n,a,b) => n+" "+(n>1?b:a);

const partnerOf = c => /CGI/.test(c.via)?"cgi":/Atos/.test(c.via)?"atos":/Softeam/.test(c.via)?"softeam":null;
const PNAME = {cgi:"CGI",atos:"Atos",softeam:"Softeam"};
const pImg = (k,cls) => `<span class="plogo ${cls||""}"><img src="${PARTNERS[k]}" alt="${PNAME[k]}"></span>`;
const viaHTML = (c,cls) => { const k=partnerOf(c); if(!k) return esc(c.via); const rest=c.via.replace(/^Via [^·]+·\s*/,""); return `Via ${pImg(k,cls)} <span>· ${esc(rest)}</span>${c.also?` <span>et via</span> ${pImg(c.also,cls)}`:""}`; };
const SQ = ["eps","orange","kappa"];
const logoSmall = c => LOGOS[c.id] ? `<span class="alogo${SQ.includes(c.id)?" sq":""}"><img src="${LOGOS[c.id]}" alt="${esc(c.name)}"></span>` : `<span class="ai">${c.ini}</span>`;
const logoBig = c => LOGOS[c.id] ? `<div><span class="lplate${SQ.includes(c.id)?" sq":""}"><img src="${LOGOS[c.id]}" alt="${esc(c.name)}"></span></div>` : "";
function nav(cur){
  const btn = (id,label,ini,count) => `<button data-go="${id}" ${cur===id?'aria-current="page"':''}>${ini?`<span class="mono-ini">${ini}</span>`:IC.dash}<span class="lbl">${esc(label)}</span>${count!==undefined?`<span class="badge${count?'':' soft'}">${count}</span>`:''}</button>`;
  let h = btn("vue","Vue d'ensemble");
  h += btn("statistiques","Statistiques",null,undefined).replace(IC.dash,IC.chart);
  h += btn("questionnaire","Questionnaire",null,undefined).replace(IC.dash,IC.form);
  h += btn("suivi","Suivi collabs",null,undefined).replace(IC.dash,IC.cal);
  h += `<div class="navsec">Espace Alex</div>`;
  C.filter(c=>c.big).forEach(c=>h+=btn(c.id,c.name,c.ini,c.collabs.length));
  C.filter(c=>!c.big).forEach(c=>h+=btn(c.id,c.name,c.ini,c.collabs.length));
  EXTRA.filter(x=>x.space==="alex").forEach(c=>h+=btn(c.id,c.name,c.ini,c.collabs.length));
  ["amir","sandrine"].forEach(s=>{
    h += `<div class="navsec">Espace ${SPACES[s]}</div>`;
    h += btn("espace-"+s,"Tous ses comptes",null,EXTRA.filter(x=>x.space===s).length).replace(IC.dash,IC.users);
    EXTRA.filter(x=>x.space===s).forEach(c=>h+=btn(c.id,c.name,c.ini,c.collabs.length));
  });
  document.getElementById("nav").innerHTML = h;
  try { const a=document.querySelector('nav.nav [aria-current="page"]'); if (a && window.innerWidth<=900) a.scrollIntoView({block:"nearest",inline:"center"}); } catch(e){}
}

function accCard(c){
  return `<button class="acc" data-go="${c.id}">
    <div class="ah">${logoSmall(c)}<div class="an"><b>${c.collabs.length}</b><span>${c.collabs.length>1?"consultants":"consultant"}</span></div></div>
    <div class="aname"><b>${esc(c.name)}</b><span>${esc(c.sector)}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${c.collabs.length?Math.max(6,c.collabs.length/maxC*100):0}%"></i></div>
    <div class="tags">${c.metiers.slice(0,3).map(m=>`<span class="pill p-com">${esc(m[0])}</span>`).join("")}</div>
    <div class="via">${IC.link}${viaHTML(c,"sm")}</div>
  </button>`;
}

function overview(){
  const inter = 3;
  return `
  <section class="hero">${SUN}<div><span class="eyebrow">Onboarding recrutement · ${C.length} comptes</span><h1>Nos comptes clients</h1><p>Ce qu'il faut savoir sur chaque client pour sourcer juste : le métier du client, ses départements, nos consultants sur place, les métiers recherchés et la stack.</p></div><div class="hcount"><b>${total}</b><span>consultants en mission</span></div></section>
  <div class="grid g4">
    <div class="kpi"><div class="kt">Consultants en mission ${`<span class="ki">${IC.users}</span>`}</div><b>${total}</b><div class="kf">chez ${C.filter(c=>c.collabs.length).length} clients</div></div>
    <div class="kpi"><div class="kt">Grands groupes <span class="ki">${IC.build}</span></div><b>5</b><div class="kf">${bigTotal} consultants, soit ${Math.round(bigTotal/total*100)} % du total</div></div>
    <div class="kpi"><div class="kt">Accès via un partenaire <span class="ki">${IC.link}</span></div><b>${inter}</b><div class="kf">CGI, Atos et Softeam</div></div>
    <div class="kpi"><div class="kt">Nouveau contrat <span class="ki">${IC.spark}</span></div><b>2027</b><div class="kf">TMA Arkopharma, démarrage en janvier</div></div>
  </div>
  <div class="sechead"><div><h2>Grands groupes</h2><p>Les cinq comptes qui portent l'essentiel de nos missions.</p></div></div>
  <div class="grid g3">${C.filter(c=>c.big).map(accCard).join("")}</div>
  <div class="sechead"><div><h2>Autres comptes</h2><p>Comptes plus ponctuels ou en démarrage.</p></div></div>
  <div class="grid g3">${C.filter(c=>!c.big).map(accCard).concat(EXTRA.filter(x=>x.space==="alex").map(accCard)).join("")}</div>
  ${["amir","sandrine"].map(s=>{ const l=EXTRA.filter(x=>x.space===s); return `<div class="sechead"><div><h2>Espace ${SPACES[s]}</h2><p>${l.length?`${plural(l.length,"compte renseigné","comptes renseignés")} via le questionnaire.`:"Aucun compte renseigné pour l'instant."}</p></div><div class="actions"><button class="btn sec" data-go="ajout-${s}">${IC.plus} Ajouter un compte</button></div></div>${l.length?`<div class="grid g3">${l.map(accCard).join("")}</div>`:""}`; }).join("")}`;
}

function card(n,title,body,extra){
  return `<section class="card"><div class="ch"><div class="tt"><span class="num">${n}</span><h2>${title}</h2></div>${extra||""}</div><div class="cb">${body}</div></section>`;
}

function clientView(c){
  const paras = a => a.map(t=>`<p>${esc(t)}</p>`).join("");
  let depts;
  if (c.depts6){
    depts = `<div class="chips6">${c.depts6.map(d=>`<span class="chip6${d[1]?" ours":""}">${esc(d[0])}${d[2]?` <span class="muted" style="font-weight:600;font-size:12px">· ${esc(d[2])}</span>`:""}</span>`).join("")}</div><p class="muted small" style="font-size:12.5px">En bleu : les directions où sont nos consultants.</p>`;
  } else if (c.depts.length){
    depts = `<div class="dept">${c.depts.map(d=>`<div class="dept-i${d.ours?" ours":""}"><span class="dept-k">${esc(d.k)}</span><div><div class="dt">${esc(d.t)}${d.ours?'<span class="pill p-ok">Nos consultants</span>':""}</div><div class="dd">${esc(d.d)}</div>${d.subs?`<div class="tags" style="margin-top:8px">${d.subs.map(s=>`<span class="pill" style="background:var(--surface);color:var(--accent)">${esc(s)}</span>`).join("")}</div>`:""}</div></div>`).join("")}</div>`;
  } else {
    depts = `<div class="empty">Pas de départements à détailler sur ce compte.</div>`;
  }
  const people = c.collabs.length
    ? `<div class="people">${c.collabs.map(p=>`<div class="person"><span class="av sm ${hv(p)}">${initials(p)}</span><div><b>${esc(p)}</b><span>${esc(c.name)}</span></div></div>`).join("")}</div>`
    : `<div class="empty">${esc(c.pending)}</div>`;
  const metiers = c.metiers.map(m=>`<div class="metier"><span class="mi">${IC.case}</span><div><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div></div>`).join("");

function famille(m){

  if (/qa/.test(s)) return "Qualité / QA";
  if (/devops|sre/.test(s)) return "DevOps / SRE";

  if (/admin|sql server/.test(s)) return "Infra et données";
  return "Développement";
}
function hbars(rows, unit, total){
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="hb">${rows.map(r=>{
    const pct = total ? Math.round(r[1]/total*100) : null;
    const tip = `${esc(r[0])}<span>${r[1]} ${r[1]>1?unit[1]:unit[0]}${pct!==null?" · "+pct+" %":""}${r[2]?" · "+esc(r[2]):""}</span>`;
    return `<div class="hr" tabindex="0" data-tip="${tip.replace(/"/g,"&quot;")}" aria-label="${esc(r[0])} : ${r[1]} ${r[1]>1?unit[1]:unit[0]}"><span class="hl">${esc(r[0])}</span><span class="ht"><span class="hf" style="width:${r[1]/max*100}%"></span></span><span class="hv">${r[1]}</span></div>`;}).join("")}</div>`;
}
function table(rows, head){
  return `<details class="tv"><summary>Voir le tableau</summary><table><thead><tr><th>${head[0]}</th><th>${head[1]}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></details>`;
}

function donut(rows, unit, centerLabel){
  const tot=rows.reduce((s,r)=>s+r[1],0), R=70, r0=46, cx=75, cy=75;
  let a=-Math.PI/2; const gap=0;
  const pt=(ang,rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
  const paths=rows.map((r,i)=>{
    const sweep=r[1]/tot*Math.PI*2, a1=a, a2=a+sweep; a=a2;
    const large=sweep>Math.PI?1:0;
    const [x1,y1]=pt(a1,R),[x2,y2]=pt(a2,R),[x3,y3]=pt(a2,r0),[x4,y4]=pt(a1,r0);
    const d=`M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 ${large} 0 ${x4} ${y4}Z`;
    const pct=Math.round(r[1]/tot*100);
    const tip=`${esc(r[0])}<span>${r[1]} ${r[1]>1?unit[1]:unit[0]} · ${pct} %</span>`;
    return `<path d="${d}" fill="var(--s${i+1})" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round" tabindex="0" data-tip="${tip.replace(/"/g,"&quot;")}" aria-label="${esc(r[0])} : ${r[1]}, ${pct} %"></path>`;
  }).join("");
  const legend=rows.map((r,i)=>`<div><i style="background:var(--s${i+1})"></i><b>${esc(r[0])}</b><span>${Math.round(r[1]/tot*100)} %</span><em>${r[1]}</em></div>`).join("");
  return `<div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="Répartition, total ${tot}">${paths}<text class="dc" x="75" y="78" text-anchor="middle">${tot}</text><text class="dcs" x="75" y="96" text-anchor="middle">${centerLabel}</text></svg><div class="lg">${legend}</div></div>`;
}

(async () => {
  let timer = setTimeout(()=>{ if(dbState==="loading"){ dbState="slow"; render(); } }, 10000);
  try {
    if (!window.claude || typeof window.claude.use!=="function") { clearTimeout(timer); dbState="off"; render(); return; }
    DB = await window.claude.use("db");
    if (!DB) { clearTimeout(timer); dbState="off"; render(); return; }
    DB.collection("comptes").onSnapshot(snap => {
      EXTRA = snap.docs.filter(d=>d.exists).map(d=>fromDoc(d.id, d.data()||{}));
      if (!snap.metadata.fromCache) { clearTimeout(timer); dbState="ready"; }
      else if (dbState==="loading") dbState="ready";
      render();
    }, err => { clearTimeout(timer); dbState="error"; dbErr = err && err.code || "unavailable"; render(); });
  } catch(e){ clearTimeout(timer); dbState="off"; render(); }
})();

let saving = false;
document.addEventListener("click", e => {
  const s = e.target.closest("#qform [data-space]");
  if (s){ document.querySelectorAll("#qform [data-space]").forEach(b=>b.setAttribute("aria-pressed", b===s?"true":"false")); return; }
  const del = e.target.closest("#q-del");
  if (del){
    const f = document.getElementById("qform"); const id = f.getAttribute("data-doc");
    if (del.dataset.armed!=="1"){ del.dataset.armed="1"; del.textContent="Confirmer la suppression"; return; }
    if (!DB || saving) return; saving=true;
    const acc = EXTRA.find(x=>x.docId===id); const sp = acc?acc.space:"amir";
    DB.collection("comptes").doc(id).delete().then(()=>{ saving=false; location.hash="espace-"+sp; })
      .catch(err=>{ saving=false; const m=document.getElementById("q-msg"); if(m) m.textContent="Suppression impossible ("+(err&&err.code||"erreur")+")."; });
  }

  if (e.target.id!=="qform") return;
  e.preventDefault();
  const msg = document.getElementById("q-msg");
  const val = id => (document.getElementById(id).value||"").trim();
  const nom = val("q-nom");
  if (!nom){ msg.textContent="À compléter : nom du client."; document.getElementById("q-nom").focus(); return; }
  if (!DB){ msg.textContent="Enregistrement indisponible ici : ouvre la version Claude de l'app."; return; }
  if (saving) return;
  const space = (document.querySelector('#qform [data-space][aria-pressed="true"]')||{}).getAttribute ? document.querySelector('#qform [data-space][aria-pressed="true"]').getAttribute("data-space") : "amir";
  const body = { space, nom, secteur:val("q-secteur"), site:val("q-site"), siteWeb:val("q-web"), grandGroupe:document.getElementById("q-big").checked,
    description:val("q-desc"), contexte:val("q-ctx"), departements:val("q-dep"), collaborateurs:val("q-col"), metiers:val("q-met"), technos:val("q-tech"),
    acces:document.getElementById("q-acces").value, partenaire:val("q-part"), contactAcces:val("q-cacc"), interlocuteurs:val("q-int"), preQual:val("q-pq"),
    majLe:new Date().toISOString() };
  let id = e.target.getAttribute("data-doc");
  if (!id) id = (nom.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"compte")+"-"+Math.random().toString(36).slice(2,7);
  saving = true; document.getElementById("q-save").disabled = true; msg.textContent="Enregistrement…";
  try { await DB.collection("comptes").doc(id).set(body); saving=false; location.hash = "x-"+id; }
  catch(err){ saving=false; const b=document.getElementById("q-save"); if(b) b.disabled=false;
    msg.textContent = (err&&err.code)==="invalid_argument" ? "Enregistrement refusé : il faut un accès Contributeur ou plus à l'app. Demande-le à Alex." : "Enregistrement impossible pour le moment, réessaie."; }

const prettyName = n => { const p=String(n).trim().split(/\s+/); return p.length>1 ? p.slice(1).join(" ")+" "+p[0] : n; };
const clientLabel = c => ({"AMADEUS":"Amadeus","ORANGE":"Orange","DOCAPOSTE":"Docaposte","PRO BTP":"PRO BTP","EPS":"EPS","KAPPA ENGINEERING":"Kappa Engineering","AIR FRANCE":"Air France"}[c] || c);
const dLong = iso => { const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); };
const dShort = iso => { const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); };
function events(){
  return PLAN.map(e => { const o=SUIVI[e.id]||{}; return Object.assign({}, e, { date:o.date||e.date, heure:o.heure||e.heure, statut:o.statut||"À faire", cr:o.cr||"", maj:o.majLe||"" }); })
    .concat(Object.entries(SUIVI).filter(([id,o])=>o.ajout).map(([id,o])=>({ id, date:o.date, heure:o.heure||"", collab:o.collab, client:o.client||"", lieu:o.lieu||"", entite:o.entite||"", statut:o.statut||"À faire", cr:o.cr||"", maj:o.majLe||"", ajout:true })))
    .sort((a,b)=> (a.date+a.heure).localeCompare(b.date+b.heure));
}
const isLate = e => e.date < todayISO() && (e.statut==="À faire" || e.statut==="Planifié");

(async () => {
  try {
    if (!window.claude || typeof window.claude.use!=="function") { suiviState="off"; return; }
    const db = await window.claude.use("db");
    if (!db) { suiviState="off"; render(); return; }
    let timer = setTimeout(()=>{ if(suiviState==="loading"){ suiviState="slow"; render(); } }, 10000);
    db.collection("suivi").onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data()||{}; });
      SUIVI = o; if (!snap.metadata.fromCache) clearTimeout(timer); suiviState="ready";
      if (!document.getElementById("rdv-form")) render();
    }, () => { clearTimeout(timer); suiviState="error"; render(); });
  } catch(e){ suiviState="off"; }
})();

function suiviNotice(){
  if (suiviState==="off") return `<div class="alert"><span class="dot"></span><div><b>Lecture seule ici.</b> Les statuts et comptes rendus s'enregistrent sur la <a href="${CLAUDE_URL}" target="_blank" rel="noopener">version Claude</a> de l'app.</div></div>`;
  if (suiviState==="slow") return `<div class="alert"><span class="dot"></span><div>Les statuts enregistrés ne répondent pas encore. L'affichage est peut-être incomplet.</div></div>`;
  if (suiviState==="error") return `<div class="alert rouge"><span class="dot"></span><div>Impossible de lire les statuts enregistrés pour le moment.</div></div>`;
  return "";
}

function calendarHTML(evs){
  const first = new Date(CAL.y, CAL.m, 1), startDow = (first.getDay()+6)%7, days = new Date(CAL.y, CAL.m+1, 0).getDate();
  const cells = []; for (let i=0;i<startDow;i++) cells.push(null);
  for (let d=1; d<=days; d++) cells.push(d); while (cells.length%7) cells.push(null);
  const pad = n => String(n).padStart(2,"0"), t = todayISO();
  const byDay = {}; evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const chip = e => `<button class="ev ${ST_CLS[e.statut]}${isLate(e)?" late":""}" data-rdv="${e.id}" title="${esc(prettyName(e.collab))} · ${esc(clientLabel(e.client))} · ${esc(e.statut)}"><span class="mono">${esc(e.heure)}</span> ${esc(prettyName(e.collab))}</button>`;
  const grid = cells.map((d,i) => {
    if (!d) return `<div class="cd empty-d"></div>`;
    const iso = CAL.y+"-"+pad(CAL.m+1)+"-"+pad(d), we = i%7>=5, list = byDay[iso]||[];
    return `<div class="cd${we?" we":""}${iso===t?" today":""}"><span class="dn">${d}</span>${list.map(chip).join("")}</div>`;
  }).join("");
  const monthEvs = evs.filter(e => e.date.startsWith(CAL.y+"-"+pad(CAL.m+1)));
  const agenda = monthEvs.length ? monthEvs.map(e => `<button class="ag-i" data-rdv="${e.id}"><span class="ag-d">${dShort(e.date)}<span class="mono">${esc(e.heure)}</span></span><span class="ag-n"><b>${esc(prettyName(e.collab))}</b><span>${esc(clientLabel(e.client))} · ${esc(e.lieu)}</span></span><span class="pill ${ST_CLS[e.statut]}">${isLate(e)?"En retard":esc(e.statut)}</span></button>`).join("") : `<div class="empty">Aucun rendez-vous ce mois-ci.</div>`;
  return `<section class="card">
    <div class="ch"><div class="tt"><h2>${MOIS[CAL.m][0].toUpperCase()+MOIS[CAL.m].slice(1)} ${CAL.y}</h2><span class="small muted">${plural(monthEvs.length,"rendez-vous","rendez-vous")}</span></div>
      <div class="actions"><button class="btn sec sm" data-cal="prev" aria-label="Mois précédent">‹</button><button class="btn sec sm" data-cal="today">Aujourd'hui</button><button class="btn sec sm" data-cal="next" aria-label="Mois suivant">›</button></div></div>
    <div class="cal"><div class="cal-h">${JOURS.map((j,i)=>`<span class="${i>=5?"we":""}">${j}</span>`).join("")}</div><div class="cal-g">${grid}</div></div>
    <div class="agenda">${agenda}</div>
    <div class="cb"><div class="legend">${STATUTS.map(s=>`<span><i class="${ST_CLS[s]}"></i>${s}</span>`).join("")}<span><i class="st-overdue"></i>En retard</span></div></div>
  </section>`;
}

function suiviView(){
  const all = events(), t = todayISO();
  const evs = CAL_CLIENT ? all.filter(e => e.client===CAL_CLIENT) : all;
  const next = evs.find(e => e.date >= t && e.statut!=="Fait");
  const ym = CAL.y+"-"+String(CAL.m+1).padStart(2,"0");
  const monthEvs = evs.filter(e => e.date.startsWith(ym)), monthDone = monthEvs.filter(e=>e.statut==="Fait").length;
  const late = evs.filter(isLate);
  const clients = [...new Set(COLLABS.map(c=>c.client))];
  const rows = COLLABS.filter(c => !CAL_CLIENT || c.client===CAL_CLIENT).map(c => {
    const mine = all.filter(e => e.collab===c.collab);
    const done = mine.filter(e => e.statut==="Fait"), last = done[done.length-1], nx = mine.find(e => e.date>=t && e.statut!=="Fait");
    return `<tr class="click" data-rdv="${nx?nx.id:""}"><td><div class="person"><span class="av sm ${hv(c.collab)}">${initials(prettyName(c.collab))}</span><div><b>${esc(prettyName(c.collab))}</b></div></div></td><td>${esc(clientLabel(c.client))}</td><td>${esc(c.lieu)}</td><td>${esc(c.creneau)}</td><td class="num-c">${done.length}</td><td>${last?dShort(last.date):"<span class='muted'>Aucun</span>"}</td><td>${nx?`<b>${dShort(nx.date)}</b> <span class="muted mono">${esc(nx.heure)}</span>`:"<span class='muted'>Rien de prévu</span>"}</td></tr>`;
  }).join("");
  return `
  <div class="phead sechead"><div><h1>Suivi collaborateurs</h1><p>Un point par mois avec chaque consultant. Clique sur un rendez-vous pour changer son statut ou saisir le compte rendu.</p></div>
    <div class="actions"><select id="cal-client" aria-label="Filtrer par client"><option value="">Tous les clients</option>${clients.map(c=>`<option value="${esc(c)}"${c===CAL_CLIENT?" selected":""}>${esc(clientLabel(c))}</option>`).join("")}</select></div></div>
  ${suiviNotice()}
  <div class="grid g4">
    <div class="kpi"><div class="kt">Prochain rendez-vous <span class="ki">${IC.cal}</span></div><b class="kpi-s">${next?dShort(next.date):"Aucun"}</b><div class="kf">${next?esc(prettyName(next.collab))+" · "+esc(next.heure)+" · "+esc(clientLabel(next.client)):"Rien de prévu"}</div></div>
    <div class="kpi"><div class="kt">Rendez-vous ce mois-ci <span class="ki">${IC.users}</span></div><b>${monthEvs.length}</b><div class="meter" aria-hidden="true"><i style="width:${monthEvs.length?monthDone/monthEvs.length*100:0}%"></i></div><div class="kf">${monthDone} fait${monthDone>1?"s":""} sur ${monthEvs.length}</div></div>
    <div class="kpi${late.length?" warn":""}"><div class="kt">En retard <span class="ki">${IC.clock}</span></div><b>${late.length}</b><div class="kf">${late.length?"Date passée, statut à mettre à jour":"Tout est à jour"}</div></div>
    <div class="kpi"><div class="kt">Collaborateurs suivis <span class="ki">${IC.users}</span></div><b>${CAL_CLIENT?COLLABS.filter(c=>c.client===CAL_CLIENT).length:COLLABS.length}</b><div class="kf">Points mardi sur site client, vendredi à l'agence</div></div>
  </div>
  ${calendarHTML(evs)}
  <section class="card"><div class="ch"><div class="tt"><h2>Collaborateurs</h2></div></div>
    <div class="tablewrap"><table><thead><tr><th>Collaborateur</th><th>Client</th><th>Lieu</th><th>Créneau mensuel</th><th>Faits</th><th>Dernier fait</th><th>Prochain</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function openRdv(id){
  const e = events().find(x => x.id===id); if (!e) return;
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="overlay" data-close="1"><form class="modal" id="rdv-form" data-id="${e.id}" novalidate role="dialog" aria-modal="true" aria-labelledby="rdv-t">
    <div class="mh"><div class="person"><span class="av ${hv(e.collab)}">${initials(prettyName(e.collab))}</span><div><h2 id="rdv-t">${esc(prettyName(e.collab))}</h2><span class="small muted">${esc(clientLabel(e.client))} · ${esc(e.lieu)} · ${esc(e.entite)}</span></div></div><button type="button" class="btn sec sm" data-close="1" aria-label="Fermer">✕</button></div>
    <div class="mb">
      <div class="qgrid"><div class="field"><label for="rdv-date">Date</label><input type="date" id="rdv-date" value="${e.date}"></div><div class="field"><label for="rdv-h">Heure</label><input type="text" id="rdv-h" value="${esc(e.heure)}"></div></div>
      <div class="field"><span class="lbl">Statut</span><div class="seg" role="group" aria-label="Statut">${STATUTS.map(s=>`<button type="button" data-st="${s}" aria-pressed="${s===e.statut}">${s}</button>`).join("")}</div></div>
      <div class="field"><label for="rdv-cr">Compte rendu</label><span class="hint">Météo de la mission, retours du collaborateur, points d'attention, suite à donner.</span><textarea id="rdv-cr" rows="6">${esc(e.cr)}</textarea></div>
      ${e.maj?`<span class="hint">Dernière mise à jour le ${new Date(e.maj).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</span>`:""}
    </div>
    <div class="mf"><span id="rdv-msg" class="hint" role="status"></span><button type="button" class="btn sec" data-close="1">Annuler</button><button type="submit" class="btn grad" id="rdv-save">Enregistrer</button></div>
  </form></div>`;
  const f = document.getElementById("rdv-cr"); if (f) f.focus();
}
function closeRdv(){ document.getElementById("modal-root").innerHTML=""; render(); }
let rdvSaving = false;
document.addEventListener("click", e => {
  const c = e.target.closest("[data-cal]");
  if (c){ const k=c.dataset.cal; if(k==="today"){ const d=new Date(); CAL={y:d.getFullYear(),m:d.getMonth()}; } else { let m=CAL.m+(k==="next"?1:-1), y=CAL.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} CAL={y,m}; } render(); return; }
  const r = e.target.closest("[data-rdv]");
  if (r && r.dataset.rdv){ openRdv(r.dataset.rdv); return; }
  const st = e.target.closest("#rdv-form [data-st]");
  if (st){ document.querySelectorAll("#rdv-form [data-st]").forEach(b=>b.setAttribute("aria-pressed", b===st?"true":"false")); return; }
  if (e.target.closest("button[data-close]") || (e.target.classList && e.target.classList.contains("overlay"))) { closeRdv(); }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && document.getElementById("rdv-form")) closeRdv(); });
document.addEventListener("change", e => { if (e.target.id==="cal-client"){ CAL_CLIENT = e.target.value; render(); } });
document.addEventListener("submit", async e => {
  if (e.target.id!=="rdv-form") return;
  e.preventDefault();
  const msg = document.getElementById("rdv-msg"), id = e.target.dataset.id;
  const statut = (document.querySelector('#rdv-form [data-st][aria-pressed="true"]')||{dataset:{st:"À faire"}}).dataset.st;
  const body = { statut, cr:document.getElementById("rdv-cr").value.trim(), date:document.getElementById("rdv-date").value, heure:document.getElementById("rdv-h").value.trim(), majLe:new Date().toISOString() };
  if (!body.date){ msg.textContent="À compléter : date."; return; }
  const db = window.claude && typeof window.claude.use==="function" ? await window.claude.use("db") : null;
  if (!db){ msg.textContent="Enregistrement indisponible ici : ouvre la version Claude de l'app."; return; }
  if (rdvSaving) return; rdvSaving = true; document.getElementById("rdv-save").disabled = true; msg.textContent = "Enregistrement…";
  const prev = SUIVI[id]; if (prev && prev.ajout) Object.assign(body, { ajout:true, collab:prev.collab, client:prev.client, lieu:prev.lieu, entite:prev.entite });
  try { await db.collection("suivi").doc(id).set(body); rdvSaving=false; closeRdv(); }
  catch(err){ rdvSaving=false; const b=document.getElementById("rdv-save"); if(b) b.disabled=false;
    msg.textContent = (err&&err.code)==="invalid_argument" ? "Enregistrement refusé : il faut un accès Contributeur ou plus." : "Enregistrement impossible pour le moment, réessaie."; }
});

function render(){
  const id = (location.hash||"").slice(1);
  const c = findAcc(id);
  const st = id==="statistiques";
  const su = id==="suivi";
  let m;
  const sp = (m=id.match(/^espace-(alex|amir|sandrine)$/)) ? m[1] : null;
  const add = (m=id.match(/^ajout-(alex|amir|sandrine)$/)) ? m[1] : (id==="questionnaire" ? "amir" : null);
  const mod = (m=id.match(/^modif-(.+)$/)) ? m[1] : null;
  const cur = c ? c.id : st ? "statistiques" : su ? "suivi" : sp ? "espace-"+sp : (add||mod) ? "questionnaire" : "vue";
  nav(cur);
  if ((add||mod) && document.getElementById("qform") && document.getElementById("qform").dataset.route===id) return;
  const crumb = t => `<span>Comptes clients</span><span>›</span><b>${esc(t)}</b>`;
  document.getElementById("crumb").innerHTML = c ? crumb(c.name) : st ? crumb("Statistiques") : su ? crumb("Suivi collaborateurs") : sp ? crumb("Espace "+SPACES[sp]) : add ? crumb("Questionnaire") : mod ? crumb("Modifier un compte") : `<b>Vue d'ensemble</b>`;
  let html;
  if (c) html = clientView(c);
  else if (st) html = stats();
  else if (su) html = suiviView();
  else if (sp) html = spaceView(sp);
  else if (add) html = formView(add, null);
  else if (mod) html = EXTRA.find(x=>x.docId===mod) ? formView(null, mod) : (dbState==="loading"||dbState==="slow" ? dbNotice() : `<div class="empty">Ce compte n'existe plus.</div>`);
  else html = overview();
  document.getElementById("main").innerHTML = html;
  const f = document.getElementById("qform"); if (f) f.dataset.route = id;
  try { document.title = c ? c.name+" · Comptes clients Inov Team" : "Comptes clients Inov Team"; } catch(e){}
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  const id = b.getAttribute("data-go");
  if (id==="vue") { try { history.replaceState(null,"",location.pathname+location.search); } catch(err){ location.hash=""; } render(); }
  else location.hash = id;
  window.scrollTo(0,0);
});
window.addEventListener("hashchange", render);
const TIP=document.createElement("div"); TIP.className="tip"; document.body.appendChild(TIP);
function showTip(el,x,y){ TIP.innerHTML=el.getAttribute("data-tip"); TIP.style.display="block"; const w=TIP.offsetWidth; TIP.style.left=Math.min(x+14, window.innerWidth-w-8)+"px"; TIP.style.top=(y+14)+"px"; }
document.addEventListener("mousemove", e=>{ const el=e.target.closest("[data-tip]"); if(el) showTip(el,e.clientX,e.clientY); else TIP.style.display="none"; });
document.addEventListener("focusin", e=>{ const el=e.target.closest("[data-tip]"); if(el){ const r=el.getBoundingClientRect(); showTip(el,r.left+r.width/2,r.bottom); } });
document.addEventListener("focusout", ()=>{ TIP.style.display="none"; });
try { document.getElementById("topdate").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); } catch(e){}
render();
</script>
</body>
</html>
